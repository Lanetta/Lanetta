openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: regulationGuide
    description: Educational content about self-regulation frameworks
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /regulation-guide:
    get:
      operationId: getRegulationGuide
      tags: [regulationGuide]
      summary: Get the self-regulation framework guide
      description: Returns the educational guide content based on the supplied project source.
      responses:
        "200":
          description: Guide content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegulationGuide"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RegulationGuide:
      type: object
      properties:
        title:
          type: string
        introduction:
          type: string
        center:
          type: string
        frameworks:
          type: array
          items:
            $ref: "#/components/schemas/Framework"
        nervousSystemStates:
          type: array
          items:
            $ref: "#/components/schemas/NervousSystemState"
        returningPractices:
          type: array
          items:
            $ref: "#/components/schemas/RegulationPractice"
        wellbeingPrinciples:
          type: array
          items:
            type: string
      required:
        - title
        - introduction
        - center
        - frameworks
        - nervousSystemStates
        - returningPractices
        - wellbeingPrinciples
    Framework:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        originator:
          type: string
        summary:
          type: string
        keyIdeas:
          type: array
          items:
            type: string
      required:
        - id
        - name
        - originator
        - summary
        - keyIdeas
    NervousSystemState:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        signals:
          type: array
          items:
            type: string
      required:
        - id
        - name
        - description
        - signals
    RegulationPractice:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
      required:
        - id
        - name
        - description

