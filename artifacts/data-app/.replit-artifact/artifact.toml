kind = "data-app"
previewPath = "/"
title = "Regulation & Clarity"
description = "An interactive guide to the Window of Tolerance, Polyvagal Theory, and mindfulness, showing how awareness, nervous-system states, and regulation practices connect."
version = "1.0.0"
id = "artifacts/data-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24452

[services.development]
run = "pnpm --filter @workspace/data-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/data-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/data-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24452"
BASE_PATH = "/"
